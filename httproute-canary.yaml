# Canary release: split the traffic by weight between two versions.
# Same name as the HTTPRoute in example-httproute.yaml, so it replaces it.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: example-httproute
spec:
  parentRefs:
    - name: example-gateway
  hostnames:
    - hello-world.info
  rules:
    - backendRefs:
        - name: web
          port: 8080
          weight: 90
        - name: web-v2
          port: 8080
          weight: 10
