# A/B testing: requests with the header "x-version: v2" go to version 2,
# all the others to version 1.
# The rule with the most specific match wins, whatever the order of the rules.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: example-httproute
spec:
  parentRefs:
    - name: example-gateway
  hostnames:
    - hello-world.info
  rules:
    - matches:
        - headers:
            - name: x-version
              value: v2
      backendRefs:
        - name: web-v2
          port: 8080
    - backendRefs:
        - name: web
          port: 8080
